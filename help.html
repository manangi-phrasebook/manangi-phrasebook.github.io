<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help Record Manangi</title>
  <meta name="description" content="Say everyday phrases in Manangi to help build the phrasebook." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔</text></svg>" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="card">
    <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Page language">
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="ne">नेपाली</button>
    </div>

    <header>
      <div class="header-text">
        <h1 id="help-title">Help record Manangi</h1>
      </div>
      <a class="header-link" href="./" id="back-link">← Phrasebook</a>
    </header>

    <p id="progress" class="status">Loading…</p>

    <section id="prompt-card" class="hidden">
      <div class="result-panel">
        <div class="label" id="say-label">Say this in Manangi</div>
        <div id="prompt-text" class="say"></div>
      </div>

      <div class="actions">
        <button id="take-btn" class="rec-main">🎙 Record</button>
      </div>
      <div id="take-review" class="hidden">
        <div id="help-consent-slot"></div>
        <div class="actions">
          <button id="take-save">✓ Save</button>
          <button id="take-again">↺ Again</button>
        </div>
      </div>
      <p id="take-msg" class="hint"></p>
      <div class="actions">
        <button id="skip-btn" class="quiet">Skip — I don't know this one</button>
      </div>

      <label class="speaker" id="speaker-label">Your name or initials (optional, kept private)
        <input id="speaker" maxlength="60" autocomplete="name" />
      </label>
    </section>

    <section id="done-card" class="hidden">
      <p class="done" id="done-msg"></p>
    </section>

    <section id="local-card" class="hidden">
      <p class="done" id="local-msg"></p>
    </section>
  </main>

  <script type="module" src="./help.js"></script>
</body>
</html>
